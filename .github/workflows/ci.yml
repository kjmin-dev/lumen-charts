name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository, so its token can do nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @lumen-charts/benchmarks exec playwright install --with-deps chromium
      - name: Compare mark renderers and exercise GPU fallback
        run: node benchmarks/runner/mark-charts.mjs --software-gl --mode webgl2,pending,canvas-only --dpr 1
      - run: pnpm build
      # What npm would receive: licenses, READMEs, exports, source maps, no workspace: ranges.
      - run: pnpm release:check
