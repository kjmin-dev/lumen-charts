name: Docs

# Deploys the documentation site in apps/docs to Cloudflare Workers as static assets.
#
# It does nothing until it is configured (see the "Hosting this site" page):
#   - environment "cloudflare" with secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID,
#     restricted to the main branch
#   - repository variable DOCS_DEPLOY=true to deploy on every push to main; without it, only a
#     manual workflow_dispatch run deploys
#   - optional repository variable DOCS_SITE with the site's public address (defaults to
#     https://lumen-charts.studiocyf.app)
#
# The repository is public and the token can replace any Worker in the account, so:
#   - Nothing here runs for a pull request, and a fork's pull request never sees a secret.
#   - Building and deploying are separate jobs. The build runs workspace and dependency code with
#     no secret. The deploy job holds the token, restores no shared tool cache, and runs only
#     Wrangler at the version and checksums pinned in pnpm-lock.yaml on the uploaded artifact.
#   - Actions are pinned to a commit SHA, because a tag can be moved to other code.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - docs/guide/**
      - docs/releasing.md
      - packages/core/**
      - packages/engine/**
      - packages/lumen-charts/**
      - packages/react/**
      - packages/vue/**
      - packages/svelte/**
      - packages/solid/**
      - tools/deploy/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/docs.yml

concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name == 'workflow_dispatch' || vars.DOCS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
        env:
          DOCS_SITE: ${{ vars.DOCS_SITE || 'https://lumen-charts.studiocyf.app' }}
      - run: pnpm docs:test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: apps/docs/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # The secrets belong to the environment, not the repository: only a run on main gets them.
    environment:
      name: cloudflare
      url: ${{ vars.DOCS_SITE || 'https://lumen-charts.studiocyf.app' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache in the deploy job: a cache is written by whichever job saved it first, and the
      # build job runs code this job must not trust.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install Wrangler from the lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @lumen-charts/deploy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: apps/docs/dist
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The cloudflare environment needs the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. See the Hosting this site page."
            exit 1
          fi
          pnpm deploy:docs
